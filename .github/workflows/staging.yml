name: Today Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/staging.yml"
      - "scripts/package-staging.py"
      - "scripts/verify-staging.py"
      - "tests/staging-verification.test.py"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the approved candidate
        required: true
        type: string
      ci_run_id:
        description: Successful Today Platform Regression run ID for that SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-packager:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the Staging checker with synthetic responses
        run: python3 tests/staging-verification.test.py
      - name: Verify packaging against the known Worker 111 baseline
        run: python3 scripts/package-staging.py 4061839b4dfdba7c8493d9f80dc1ecb82256cbac staging/baseline

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate CI and package the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          CI_RUN: ${{ inputs.ci_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repository = os.environ["GITHUB_REPOSITORY"]
          sha, run_id = os.environ["CANDIDATE"], os.environ["CI_RUN"]
          if not re.fullmatch(r"[0-9a-f]{40}",sha) or not re.fullmatch(r"[1-9][0-9]*",run_id):
              raise SystemExit("Invalid candidate SHA or CI run ID")
          endpoint = f"repos/{repository}/actions/runs/{run_id}"
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",path]))
          run = api(endpoint)
          expected = {"head_sha":sha, "status":"completed", "conclusion":"success",
                      "path":".github/workflows/platform-regression.yml"}
          if any(run.get(k) != v for k,v in expected.items()):
              raise SystemExit("CI run does not attest this exact candidate")
          if (run.get("head_repository",{}).get("full_name") != repository
                  or run.get("event") not in {"push","pull_request"}):
              raise SystemExit("CI must run on the Today repository")
          required = {"Platform regression","Real browser and mobile WebKit",
                      "Native preview (android)","Native preview (ios)"}
          jobs = api(endpoint+"/jobs?filter=latest&per_page=100")["jobs"]
          if not required <= {job["name"] for job in jobs if job.get("conclusion")=="success"}:
              raise SystemExit("One or more required jobs did not pass")
          PY
          # Only the trusted workflow checkout's packager executes.
          python3 scripts/package-staging.py "$CANDIDATE" staging
      - uses: actions/upload-artifact@v7
        with:
          name: staging-approved-candidate
          path: staging/*.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://today-ai-staging.pages.dev
    concurrency:
      group: today-staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: staging-approved-candidate
          path: staging
      - name: Extract the approved candidate
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          archive, = Path("staging").glob("*.zip")
          with ZipFile(archive) as source:
              source.extractall("staging/site")
          PYTHON
      - name: Check existing Staging and service access before upload
        id: preflight
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/verify-staging.py preflight --state staging/previous.json --site staging/site --commit "$CANDIDATE"
      - name: Deploy only to the stable Today Staging project
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          BRANCH: ${{ steps.preflight.outputs.branch }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: npx --yes wrangler@4.168.0 pages deploy staging/site --project-name=today-ai-staging --branch="$BRANCH" --commit-hash="$CANDIDATE"
      - name: Verify deployed addresses and exact candidate bytes
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/verify-staging.py verify --state staging/previous.json --site staging/site --commit "$CANDIDATE"
