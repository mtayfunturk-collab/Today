name: Today Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [task/today-master-inventory]
    paths:
      - ".github/workflows/staging.yml"
      - "scripts/package-staging.py"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the approved candidate
        required: true
        type: string
      ci_run_id:
        description: Successful Today Platform Regression run ID for that SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  iphone-archives:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 50 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package the two immutable iPhone revisions
        run: |
          python3 scripts/package-staging.py 4061839b4dfdba7c8493d9f80dc1ecb82256cbac staging/baseline
          python3 scripts/package-staging.py eba50be95c0ff3fa43cdd590493cfcf71dff20b2 staging/candidate
      - uses: actions/upload-artifact@v7
        with:
          path: staging/baseline/today-staging-worker111-4061839.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          path: staging/candidate/today-staging-worker113-eba50be.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate CI and package the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          CI_RUN: ${{ inputs.ci_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repository = os.environ["GITHUB_REPOSITORY"]
          sha, run_id = os.environ["CANDIDATE"], os.environ["CI_RUN"]
          if not re.fullmatch(r"[0-9a-f]{40}",sha) or not re.fullmatch(r"[1-9][0-9]*",run_id):
              raise SystemExit("Invalid candidate SHA or CI run ID")
          endpoint = f"repos/{repository}/actions/runs/{run_id}"
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",path]))
          run = api(endpoint)
          expected = {"head_sha":sha, "status":"completed", "conclusion":"success",
                      "path":".github/workflows/platform-regression.yml"}
          if any(run.get(k) != v for k,v in expected.items()):
              raise SystemExit("CI run does not attest this exact candidate")
          if (run.get("head_repository",{}).get("full_name") != repository
                  or run.get("event") not in {"push","pull_request"}):
              raise SystemExit("CI must run on the Today repository")
          required = {"Platform regression","Real browser and mobile WebKit",
                      "Native preview (android)","Native preview (ios)"}
          jobs = api(endpoint+"/jobs?filter=latest&per_page=100")["jobs"]
          if not required <= {job["name"] for job in jobs if job.get("conclusion")=="success"}:
              raise SystemExit("One or more required jobs did not pass")
          PY
          # Only the trusted workflow checkout's packager executes.
          python3 scripts/package-staging.py "$CANDIDATE" staging
      - uses: actions/upload-artifact@v7
        with:
          name: staging-approved-candidate
          path: staging/*.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://today-ai-staging.pages.dev
    concurrency:
      group: today-staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          name: staging-approved-candidate
          path: staging
      - name: Check protected origins and prepare upload
        env:
          PREVIEW_URLS: ${{ vars.CLOUDFLARE_STAGING_PREVIEW_URLS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import build_opener, HTTPRedirectHandler
          from urllib.parse import urlsplit
          from zipfile import ZipFile
          import os, re

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = build_opener(NoRedirect)
          previews = os.environ.get("PREVIEW_URLS","").split()
          if not previews or any(not re.fullmatch(
                  r"https://[a-z0-9-]+\.today-ai-staging\.pages\.dev/?", url) for url in previews):
              raise SystemExit("Configure verified Staging preview hostname URLs")
          for origin in ["https://today-ai-staging.pages.dev", *previews]:
              for route in ["/", "/index.html", "/sw.js", "/candidate.json"]:
                  try:
                      with opener.open(origin.rstrip("/") + route, timeout=15) as response:
                          raise SystemExit(f"Staging origin unexpectedly returned {response.status}")
                  except HTTPError as response:
                      hostname = urlsplit(response.headers.get("Location", "")).hostname or ""
                      if response.code not in {401,403} and not (
                          response.code in {302,303,307,308} and hostname.endswith(".cloudflareaccess.com")
                      ):
                          raise SystemExit(f"Unexpected Staging access response: {response.code}")
          archive, = Path("staging").glob("*.zip")
          with ZipFile(archive) as source:
              source.extractall("staging/site")
          PY
      - name: Deploy only to the stable Today Staging project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          branch="$(python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          if not re.fullmatch(r"[0-9a-f]{32}", account):
              raise SystemExit("Invalid Cloudflare account ID")
          headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"]}
          url=f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/today-ai-staging"
          with urlopen(Request(url,headers=headers),timeout=20) as response:
              project=json.load(response)["result"]
          if project["subdomain"] != "today-ai-staging.pages.dev":
              raise SystemExit("Staging hostname does not match")
          branch=project["production_branch"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9/_.-]{0,127}",branch):
              raise SystemExit("Invalid Staging project branch")
          print(branch)
          PY
          )"
          npx --yes wrangler@4.168.0 pages deploy staging/site --project-name=today-ai-staging --branch="$branch"
