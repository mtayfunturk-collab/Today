name: Today Platform Regression

on:
  push:
    paths:
      - "index.html"
      - "storage.js"
      - "health-hub.js"
      - "sw.js"
      - "modules/**"
      - "Today-AI-Engine/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/platform-regression.yml"
  pull_request:
    paths:
      - "index.html"
      - "storage.js"
      - "health-hub.js"
      - "sw.js"
      - "modules/**"
      - "Today-AI-Engine/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/platform-regression.yml"

permissions:
  contents: read

concurrency:
  group: today-platform-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Platform regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run regression gate
        run: npm test

      - name: Run AI Engine tests
        run: node Today-AI-Engine/tests/run-tests.mjs

      - name: Run AI Engine benchmark
        run: node Today-AI-Engine/tests/run-benchmark.mjs
